name: Live site health

on:
  schedule:
    - cron: '23 14 * * 1' # Mondays at 14:23 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-site-health
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the audit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the audit fixtures
        run: npx tsx --test tests/site-health.test.ts
      - name: Audit the canonical live site
        run: npm run seo:audit
      - name: Keep the health report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: happy-trails-site-health
          path: test-results/site-health/
          if-no-files-found: warn
          retention-days: 30
